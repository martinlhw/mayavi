# This file should be copied to the ROOT of your forked mayavi repository.
# SonarQube reads it when sonar-scanner is run by Jenkins.

sonar.projectKey=mayavi-analysis
sonar.projectName=Mayavi Static Analysis
sonar.projectVersion=1.0

# Root of the source files (relative to this file)
sonar.sources=.

# Only scan Python files
sonar.inclusions=**/*.py
sonar.exclusions=**/test*/**,**/*test*.py,**/setup.py,**/conf.py

sonar.python.version=3

# Encoding
sonar.sourceEncoding=UTF-8
